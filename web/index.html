<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strata Profile Studio</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top">
    <h1 class="brand">
      <img class="brand-mark" src="/static/favicon.svg" alt="" width="24" height="24">
      <span>Strata Profile Studio</span>
    </h1>
    <nav class="tabs" aria-label="Views" id="tabs">
      <a class="tab" href="#live" data-view="live">Live</a>
      <a class="tab" href="#compare" data-view="compare">Compare</a>
      <a class="tab" href="#tune" data-view="tune">Tune</a>
    </nav>
    <span class="top-fill"></span>
    <span id="pill" class="pill pill-idle" role="status"><span class="dot" aria-hidden="true"></span><span id="pill-text" class="pill-text">Connecting</span></span>
    <div class="ctl">
      <div id="range" class="seg" role="group" aria-label="Requests shown"></div>
      <button id="data-btn" class="btn" type="button" aria-pressed="false">Data</button>
      <button id="settings-btn" class="btn btn-icon" type="button" aria-label="Settings" title="Settings">⚙</button>
      <button id="theme-btn" class="btn btn-icon" type="button" aria-label="Theme: system" title="Theme"><span class="theme-glyph"></span></button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

  <main id="main" class="page" tabindex="-1">
    <noscript><span class="empty-note">Needs JavaScript</span></noscript>
    <section id="view-live" hidden></section>
    <section id="view-compare" hidden></section>
    <section id="view-tune" hidden></section>
  </main>

  <dialog id="drawer" class="drawer" aria-label="Settings"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="key-dialog" class="dialog">
    <form method="dialog" id="key-form">
      <h2>This Studio needs a key</h2>
      <p id="key-error" class="error-text" hidden></p>
      <label class="field">Key
        <input id="key-input" type="password" autocomplete="off" spellcheck="false">
      </label>
      <div class="row">
        <button class="btn btn-primary" type="submit">Continue</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog" id="confirm-form">
      <h2 id="confirm-title">Tune this PC?</h2>
      <p id="confirm-text"></p>
      <div class="row">
        <button class="btn" value="cancel" type="submit">Cancel</button>
        <button class="btn btn-primary" value="ok" type="submit" id="confirm-ok">Tune this PC</button>
      </div>
    </form>
  </dialog>

  <script src="/static/vendor/chart-4.4.1.umd.js"></script>
  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
